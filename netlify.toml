[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200

[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

[[redirects]]
  from = "/api/reset"
  to = "/.netlify/functions/reset"
  status = 200

[[redirects]]
  from = "/api/generation"
  to = "/.netlify/functions/generation"
  status = 200
